{% extends 'base.html' %}
{% load static %}

{% block content %}

<main class="register-page">
        <section class="register-panel" aria-labelledby="register-title">
            <div class="brand-mark" aria-hidden="true">R</div>
            <p class="eyebrow">RememberIt · Gestión del hogar</p>
            <h1 id="register-title">Actualizar Residente</h1>
            <p class="intro">Actualiza la información de residentes.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post" class="register-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary w-100" type="submit">Actualizar Residente</button>
            </form>
        </section>
    </main>

{% endblock %}
