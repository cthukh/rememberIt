{% extends "base.html" %}

{% block title %}Recuperar contraseña{% endblock %}

{% block content %}
    <section class="login-panel">
        <h1>Recuperar contraseña</h1>
        <p class="login-intro">Escribe el correo de tu cuenta y te enviaremos un enlace para cambiar la contraseña.</p>
        <form method="post" class="login-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary w-100" type="submit">Enviar enlace</button>
        </form>
    </section>
{% endblock %}
